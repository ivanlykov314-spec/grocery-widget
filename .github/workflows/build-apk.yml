name: Собрать APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/release/app-release.apk grocery-widget.apk

      - name: Опубликовать релиз (ссылка для скачивания на телефон)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Покупки — сборка ${{ github.run_number }}
          files: grocery-widget.apk
          make_latest: true
